<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!doctype html>
<html lang="hi">
<head>
<title>संत एवं लोक देवता क्विज़</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ec;--card:#fffdf8;--ink:#2a2118;--mute:#6f6455;--line:#e4dccd;--acc:#b5502a;--acc2:#f3e1d6;--ok:#2f7a4a;--okbg:#e2f1e6;--bad:#b3261e;--badbg:#f8e1df;--chip:#efe8dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#211c16;--ink:#efe7da;--mute:#a99d8b;--line:#3a3128;--acc:#e8875e;--acc2:#3d2a20;--ok:#7cc795;--okbg:#1f3326;--bad:#f08a80;--badbg:#3d211e;--chip:#2c251e}}
:root[data-theme="dark"]{--bg:#17130f;--card:#211c16;--ink:#efe7da;--mute:#a99d8b;--line:#3a3128;--acc:#e8875e;--acc2:#3d2a20;--ok:#7cc795;--okbg:#1f3326;--bad:#f08a80;--badbg:#3d211e;--chip:#2c251e}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta","Nirmala UI",sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden}
h1,h2,h3{font-family:"Tiro Devanagari Hindi","Nirmala UI",serif;font-weight:400;margin:.2em 0 .4em}
.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.lbl{font-weight:700;margin:14px 0 6px;color:var(--mute);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer{font-weight:500}.timer.red{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px;max-width:720px;margin-left:auto;margin-right:auto}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.q{font-size:1.15rem;font-weight:600;margin-bottom:12px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;margin:8px 0;font:inherit;cursor:pointer;overflow-wrap:anywhere}
.opt b{font-family:"IBM Plex Mono",monospace;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;max-height:160px;overflow-y:auto;padding:2px}
.grid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 0;font:13px "IBM Plex Mono",monospace;cursor:pointer}
.grid button.ans{background:var(--acc2);border-color:var(--acc)}
.grid button.cur{outline:2px solid var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:10px;text-align:center}
.stat .n{font:500 1.3rem "IBM Plex Mono",monospace}.stat .t{font-size:.8rem;color:var(--mute)}
.big{font:500 2.2rem "IBM Plex Mono",monospace}
.rv{border-left:4px solid var(--line)}
.rv.c{border-left-color:var(--ok)}.rv.w{border-left-color:var(--bad)}
.ok{background:var(--okbg);color:var(--ok);border-radius:8px;padding:6px 10px;margin:6px 0}
.bad{background:var(--badbg);color:var(--bad);border-radius:8px;padding:6px 10px;margin:6px 0}
.small{font-size:.85rem;color:var(--mute)}
.sh{padding:6px 10px;font-size:.85rem;text-decoration:none;display:inline-block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:400px;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:30}
.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
</style>
</head>
<body>
<section id="start" class="wrap">
  <div class="row"><h1 class="sp">राजस्थान के प्रमुख संत एवं लोक देवता</h1><button class="theme" id="themeBtn" aria-label="थीम बदलें">◐</button></div>
  <div class="small">अध्याय 2 · <span id="totalCards"></span> प्रश्न-बैंक</div>
  <div class="card">
    <div class="lbl">प्रश्नों की संख्या</div><div class="chips" id="cN"></div>
    <div class="lbl">समय सीमा</div><div class="chips" id="cT"></div>
    <div class="lbl">ऋणात्मक अंकन</div><div class="chips" id="cM"></div>
    <div class="row" style="margin-top:18px"><button class="btn pri" id="go">शुरू करें</button><span class="small" id="last"></span></div>
  </div>
</section>

<section id="quiz" hidden>
  <div class="bar"><div class="in"><span id="cnt" class="mono"></span><span class="sp"></span><span id="tm" class="timer mono"></span><button class="btn pri sh" id="sub">जमा करें</button></div>
  <div class="prog"><i id="pb"></i></div></div>
  <div class="wrap">
    <div class="card">
      <div class="small mono" id="qn"></div>
      <div class="q" id="qt"></div>
      <div id="opts"></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="prev">← पिछला</button><button class="btn" id="clr">उत्तर हटाएँ</button><span class="sp"></span><button class="btn pri" id="next">अगला →</button></div>
    </div>
    <div class="card"><div class="lbl" style="margin-top:0">प्रश्न पर जाएँ</div><div class="grid" id="grid"></div></div>
    <div class="small">कीबोर्ड: 1–4 या A–D से उत्तर, ← → से आगे-पीछे</div>
  </div>
</section>

<section id="result" class="wrap" hidden>
  <h2>परिणाम</h2>
  <div class="card">
    <div class="row"><div><div class="big" id="rMarks"></div><div class="small" id="rPct"></div></div><span class="sp"></span><h3 id="rRemark" style="margin:0"></h3></div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><div class="n" id="rC"></div><div class="t">सही</div></div>
      <div class="stat"><div class="n" id="rW"></div><div class="t">गलत</div></div>
      <div class="stat"><div class="n" id="rU"></div><div class="t">अनुत्तरित</div></div>
    </div>
    <div class="small" style="margin-top:8px" id="rTime"></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="newQ">नए प्रश्न</button><button class="btn" id="retry">गलत/छूटे दोबारा</button><button class="btn" id="chg">सेटिंग बदलें</button></div>
  </div>
  <div class="chips" id="flt" style="margin:8px 0"></div>
  <div class="card" id="shareAll">
    <div class="row"><span class="sp small" id="saInfo"></span>
      <button class="btn sh" id="saWa">WhatsApp</button><button class="btn sh" id="saSh">Share…</button><button class="btn sh" id="saCp">Copy</button></div>
    <div class="small" id="saNote" hidden>पाठ लंबा है — Share या Copy का उपयोग करें।</div>
  </div>
  <div id="rev"></div>
</section>
<div class="modal" id="cfm" hidden><div class="card"><div id="cfmT"></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="cfmNo">वापस</button><button class="btn pri" id="cfmYes">जमा करें</button></div></div></div>
<div class="toast" id="toast" hidden>Copied</div>

<script>

let R=[];
function finish(){if(done)return;done=true;clearInterval(tick);const used=Math.min(Date.now(),endAt)-startAt;
 R=Q.map((q,k)=>{const a=ans[k];const st=a===null?"u":(q.o[a].k===0?"c":"w");return{q,a,st}});
 const c=R.filter(r=>r.st==="c").length,w=R.filter(r=>r.st==="w").length,u=R.length-c-w;const marks=c-w*S.m;const pct=marks/R.length*100;
 $("rMarks").textContent=`${+marks.toFixed(2)} / ${R.length}`;$("rPct").textContent=`${pct.toFixed(1)}%`;$("rC").textContent=c;$("rW").textContent=w;$("rU").textContent=u;
 const mm=Math.floor(used/60000),ss=Math.floor(used%60000/1000);$("rTime").textContent=`लिया गया समय: ${mm} मिनट ${ss} सेकंड`;
 $("rRemark").textContent=pct>=85?"उत्कृष्ट":pct>=65?"बहुत अच्छा":pct>=40?"और अभ्यास करें":"दोहराने की आवश्यकता है";
 const d=new Date();ls("ch2q_last",{s:+marks.toFixed(2),n:R.length,d:d.toLocaleDateString("hi-IN")});
 $("retry").disabled=!(w+u);filter="all";renderFlt();renderRev();show("result")}
const FL=[["all","सभी"],["w","गलत"],["u","अनुत्तरित"],["c","सही"]];
function renderFlt(){$("flt").innerHTML="";FL.forEach(([k,t])=>{const n=k==="all"?R.length:R.filter(r=>r.st===k).length;const b=document.createElement("button");b.className="chip"+(filter===k?" on":"");b.textContent=`${t} (${n})`;b.onclick=()=>{filter=k;renderFlt();renderRev()};$("flt").appendChild(b)})}
function shareText(r){const c=CARDS[r.q.i];const ci=r.q.o.findIndex(o=>o.k===0);let t=`प्रश्न: ${strip(c.f)}\n`+r.q.o.map((o,j)=>`(${L[j]}) ${o.t}`).join("\n")+`\n✅ सही उत्तर: (${L[ci]}) ${r.q.o[ci].t}`;
 const full=strip(c.b);if(full.trim()!==r.q.o[ci].t.trim())t+=`\nविवरण: ${full}`;return t+`\n— ${CH}`}
function wa(t){return "https://api.whatsapp.com/send?text="+encodeURIComponent(t)}
function toast(m){$("toast").textContent=m||"Copied";$("toast").hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").hidden=true,1400)}
function copy(t){const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();toast()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast(),fb);else fb()}
function share(t){if(navigator.share){navigator.share({text:t}).catch(e=>{if(e&&e.name!=="AbortError")copy(t)})}else copy(t)}
function sbtns(el,t){const a=document.createElement("a");a.className="btn sh";a.textContent="WhatsApp";a.href=wa(t);a.target="_blank";a.rel="noopener";
 const s=document.createElement("button");s.className="btn sh";s.textContent="Share…";s.onclick=()=>share(t);
 const c=document.createElement("button");c.className="btn sh";c.textContent="Copy";c.onclick=()=>copy(t);el.append(a,s,c)}
function renderRev(){const list=R.filter(r=>filter==="all"||r.st===filter);const box=$("rev");box.innerHTML="";
 list.forEach(r=>{const c=CARDS[r.q.i];const k=R.indexOf(r);const d=document.createElement("div");d.className="card rv "+r.st;
  d.innerHTML=`<div class="small mono">प्रश्न ${k+1}</div><div class="q"></div>`;d.querySelector(".q").innerHTML=c.f;
  if(r.st==="w"){const x=document.createElement("div");x.className="bad";x.textContent="आपका उत्तर: "+r.q.o[r.a].t;d.appendChild(x)}
  if(r.st==="u"){const x=document.createElement("div");x.className="small";x.textContent="अनुत्तरित";d.appendChild(x)}
  const ok=document.createElement("div");ok.className="ok";ok.innerHTML="सही उत्तर: "+c.b;d.appendChild(ok);
  const row=document.createElement("div");row.className="row";sbtns(row,shareText(r));d.appendChild(row);box.appendChild(d)});
 const all=list.map(shareText).join("\n\n");$("shareAll").hidden=!list.length;$("saInfo").textContent=`दिखाए गए ${list.length} प्रश्न साझा करें`;
 const long=all.length>6000;$("saWa").hidden=long;$("saNote").hidden=!long;
 $("saWa").onclick=()=>window.open(wa(all),"_blank","noopener");$("saSh").onclick=()=>share(all);$("saCp").onclick=()=>copy(all)}
$("go").onclick=()=>begin(CARDS.map((_,i)=>i));
$("newQ").onclick=()=>begin(CARDS.map((_,i)=>i));
$("retry").onclick=()=>begin(R.filter(r=>r.st!=="c").map(r=>r.q.i));
$("chg").onclick=()=>{renderStart();show("start")};
$("themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";ls("ch2q_theme",r.dataset.theme)};
(()=>{const t=ls("ch2q_theme");if(t)document.documentElement.dataset.theme=t})();
renderStart();
</script>
</body>
</html>
